l_japanese:
 decision_group_type_rtg:0 "称号の配分"
 rtg_transfer_vassals_decision:0 "封臣を正当な主君に与える"
 rtg_transfer_vassals_decision_desc:0 "すべての直属の封臣を、その慣習的な上位称号を持つ封臣に従属させます。"
 rtg_transfer_vassals_decision_tooltip:0 "慣習的な称号の関係に従って封臣を再編します。"
 rtg_transfer_vassals_decision_effect_tt:0 "直属の封臣は、その慣習的な上位称号を持つ封臣に従属します（戦争中の対象を除く）。"
 rtg_grant_counties_own_culture_decision:0 "伯爵領を与える（自分の文化）"
 rtg_grant_counties_own_culture_decision_desc:0 "直轄領の各伯爵領を、あなたと同じ文化、宗派、流派を持つ新たな人物に与えます。首都と配分対象から除外した伯爵領は与えません。"
 rtg_grant_counties_own_culture_decision_tooltip:0 "伯爵領ごとに新たな封臣を1人任命します。"
 rtg_grant_counties_own_culture_decision_effect_tt:0 "首都と配分対象から除外した伯爵領を除き、各伯爵領にあなたと同じ文化、宗派、流派を持つ新たな人物を作成し、その伯爵領を与えます。"
 rtg_grant_counties_local_culture_decision:0 "伯爵領を与える（現地の文化）"
 rtg_grant_counties_local_culture_decision_desc:0 "直轄領の各伯爵領を、その伯爵領と同じ文化を持ち、あなたと同じ宗派と流派を持つ新たな人物に与えます。首都と配分対象から除外した伯爵領は与えません。"
 rtg_grant_counties_local_culture_decision_tooltip:0 "伯爵領ごとに新たな封臣を1人任命します。"
 rtg_grant_counties_local_culture_decision_effect_tt:0 "首都と配分対象から除外した伯爵領を除き、各伯爵領に現地の文化と、あなたと同じ宗派と流派を持つ新たな人物を作成し、その伯爵領を与えます。"
 rtg_has_counties_to_grant_tt:0 "首都でも配分対象から除外した領地でもない伯爵領を、少なくとも1つ保有している"
 rtg_has_titles_to_distribute_tt:0 "この階級の称号を少なくとも1つ保有しており、それが主要称号ではなく、首都を含まず、配分対象からも除外されていない"
 rtg_create_duchies_decision:0 "公爵領を創設する"
 rtg_create_duchies_decision_desc:0 "現在ゲーム内で創設可能な公爵領をすべて、費用なしで創設します。"
 rtg_create_duchies_decision_tooltip:0 "創設可能な公爵領をすべて創設します。"
 rtg_create_duchies_decision_effect_tt:0 "通常の創設条件を満たすすべての公爵領を、費用なしで獲得します。"
 rtg_create_kingdoms_decision:0 "王国を創設する"
 rtg_create_kingdoms_decision_desc:0 "現在ゲーム内で創設可能な王国をすべて、費用なしで創設します。"
 rtg_create_kingdoms_decision_tooltip:0 "創設可能な王国をすべて創設します。"
 rtg_create_kingdoms_decision_effect_tt:0 "通常の創設条件を満たすすべての王国を、費用なしで獲得します。"
 rtg_create_empires_decision:0 "帝国を創設する"
 rtg_create_empires_decision_desc:0 "現在ゲーム内で創設可能な帝国をすべて、費用なしで創設します。"
 rtg_create_empires_decision_tooltip:0 "創設可能な帝国をすべて創設します。"
 rtg_create_empires_decision_effect_tt:0 "通常の創設条件を満たすすべての帝国を、費用なしで獲得します。"
 rtg_distribute_duchies_decision:0 "公爵領を配分する"
 rtg_distribute_duchies_decision_desc:0 "各公爵領を、その慣習的首都の伯爵領を持つ人物に与えます。対象者はその公爵領内に居住し、主要称号もその領域内になければなりません。"
 rtg_distribute_duchies_decision_tooltip:0 "領域に従って公爵領を配分します。"
 rtg_distribute_duchies_decision_effect_tt:0 "各公爵領を、その慣習的首都の伯爵領を持つ人物に与えます。首都を含む公爵領と配分対象から除外した公爵領は与えません。ほかに候補がいなければ、その公爵領内で最も多くの伯爵領を持つ人物に与えます。対象者はその公爵領内に居住し、主要称号もその領域内になければなりません。適格者がいなければ、あなたが保有し続けます。慣習的な封臣は新たな称号所有者に従属します。"
 rtg_distribute_kingdoms_decision:0 "王国を配分する"
 rtg_distribute_kingdoms_decision_desc:0 "各王国を、その慣習的首都の公爵領を持つ人物に与えます。それができなければ、首都の伯爵領を持つ人物に与えます。対象者はその王国内に居住し、主要称号もその領域内になければなりません。"
 rtg_distribute_kingdoms_decision_tooltip:0 "領域に従って王国を配分します。"
 rtg_distribute_kingdoms_decision_effect_tt:0 "各王国を、その慣習的首都の公爵領を持つ人物に与えます。それができなければ、首都の伯爵領を持つ人物に与えます。首都を含む王国と配分対象から除外した王国は与えません。ほかに候補がいなければ、その王国内で最も多くの伯爵領を持つ人物に与えます。対象者はその王国内に居住し、主要称号もその領域内になければなりません。適格者がいなければ、あなたが保有し続けます。慣習的な封臣は新たな称号所有者に従属します。"
 rtg_distribute_empires_decision:0 "帝国を配分する"
 rtg_distribute_empires_decision_desc:0 "各帝国を、その慣習的首都の王国を持つ人物に与えます。それができなければ、首都の公爵領、伯爵領の順に所有者を探します。対象者はその帝国内に居住し、主要称号もその領域内になければなりません。"
 rtg_distribute_empires_decision_tooltip:0 "領域に従って帝国を配分します。"
 rtg_distribute_empires_decision_effect_tt:0 "各帝国を、その慣習的首都の王国を持つ人物に与えます。それができなければ、首都の公爵領、伯爵領の順に所有者を探します。首都を含む帝国と配分対象から除外した帝国は与えません。ほかに候補がいなければ、その帝国内で最も多くの伯爵領を持つ人物に与えます。対象者はその帝国内に居住し、主要称号もその領域内になければなりません。適格者がいなければ、あなたが保有し続けます。慣習的な封臣は新たな称号所有者に従属します。"
 rtg_title_excluded_tt:0 "この称号を配分対象から除外しました。"
 rtg_title_included_tt:0 "この称号を配分対象に含めました。"
 rtg_exclude_button:0 "配分対象から除外"
 rtg_include_button:0 "配分対象に含める"
 rtg_exclude_button_tt:0 "除外した称号は「称号の配分」の決断では与えられません。"
 rtg_transfer_vassals_decision_confirm:0 "封臣を与える"
 rtg_grant_counties_own_culture_decision_confirm:0 "伯爵領を与える"
 rtg_grant_counties_local_culture_decision_confirm:0 "伯爵領を与える"
 rtg_create_duchies_decision_confirm:0 "公爵領を創設する"
 rtg_create_kingdoms_decision_confirm:0 "王国を創設する"
 rtg_create_empires_decision_confirm:0 "帝国を創設する"
 rtg_distribute_duchies_decision_confirm:0 "公爵領を配分する"
 rtg_distribute_kingdoms_decision_confirm:0 "王国を配分する"
 rtg_distribute_empires_decision_confirm:0 "帝国を配分する"
 rtg_preview_county_new_vassal:0 "[TITLE.GetName]を新たな封臣に与えます"
 rtg_preview_title_to_vassal:0 "[TITLE.GetName]を[TARGET_CHARACTER.GetShortUIName]に与えます"
 rtg_preview_title_no_recipient:0 "[TITLE.GetName]は引き続きあなたが保有します #weak （適格な封臣がいません）#!"
 rtg_preview_title_created:0 "[TITLE.GetName]を創設します"
 rtg_preview_vassal_transfer:0 "[CHARACTER.GetShortUIName]は[TARGET_CHARACTER.GetShortUIName]に従属します"
 rtg_vassal_limit_warning_tt:0 "@warning_icon! 新たに#V [GetPlayer.MakeScope.ScriptValue('rtg_counties_to_grant_value')|0]#!人の封臣を任命します。[vassal_limit|E]に注意してください。その後、公爵領を配分して、新たな伯爵たちを公爵の配下に置きましょう。"
 rtg_fix_bordergore_decision:0 "領土の入り組みを解消する"
 rtg_fix_bordergore_decision_desc:0 "封臣が慣習的領土の外に持つ伯爵領を取り戻し、誤った主君に従属する封臣をあなたに直接従属させます。"
 rtg_fix_bordergore_decision_tooltip:0 "封臣の領土の入り組みを整理します。"
 rtg_fix_bordergore_decision_effect_tt:0 "公爵以上の封臣が持つ称号の慣習的領土の外にある伯爵領は、あなたに返還されます。ただし、その封臣が慣習的領土内に伯爵領を少なくとも1つ保持できる場合に限ります。それらの称号の領域外に主要称号を持つ伯爵以上の配下の封臣は、あなたの直属の封臣になります。男爵は対象外です。"
 rtg_fix_bordergore_decision_confirm:0 "領土の入り組みを解消する"
 rtg_preview_bg_county:0 "[TITLE.GetName]が[TARGET_CHARACTER.GetShortUIName]からあなたに返還されます"
 rtg_preview_bg_subvassal:0 "[CHARACTER.GetShortUIName]は[TARGET_CHARACTER.GetShortUIName]の配下を離れ、あなたに従属します"
