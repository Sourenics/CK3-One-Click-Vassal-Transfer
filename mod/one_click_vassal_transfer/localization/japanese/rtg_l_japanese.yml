l_japanese:
 decision_group_type_rtg:0 "Title Distribution"
 rtg_transfer_vassals_decision:0 "Transfer Vassals to their De Jure Liege"
 rtg_transfer_vassals_decision_desc:0 "Every direct vassal swears fealty to the vassal who holds their de jure liege title."
 rtg_transfer_vassals_decision_tooltip:0 "Reorganize your vassals according to de jure titles."
 rtg_transfer_vassals_decision_effect_tt:0 "Your direct vassals will swear fealty to the vassal holding their de jure liege title (except those at war)."
 rtg_grant_counties_own_culture_decision:0 "Grant Counties (Your Culture)"
 rtg_grant_counties_own_culture_decision_desc:0 "Every county in your domain, except your capital and excluded counties, is granted to a brand-new character of your culture, faith and rite."
 rtg_grant_counties_own_culture_decision_tooltip:0 "One county, one new vassal."
 rtg_grant_counties_own_culture_decision_effect_tt:0 "A new character of your culture, faith and rite is created for every county that is not your capital nor excluded, and receives it."
 rtg_grant_counties_local_culture_decision:0 "Grant Counties (Local Culture)"
 rtg_grant_counties_local_culture_decision_desc:0 "Every county in your domain, except your capital and excluded counties, is granted to a brand-new character of the county's culture, faith and rite."
 rtg_grant_counties_local_culture_decision_tooltip:0 "One county, one new vassal."
 rtg_grant_counties_local_culture_decision_effect_tt:0 "A new character of the local culture, faith and rite is created for every county that is not your capital nor excluded, and receives it."
 rtg_has_counties_to_grant_tt:0 "You hold at least one county that is not your capital nor excluded"
 rtg_has_titles_to_distribute_tt:0 "You hold at least one title of this rank that is not your primary title, does not contain your capital and is not excluded"
 rtg_create_duchies_decision:0 "Create Duchies"
 rtg_create_duchies_decision_desc:0 "Create every duchy the game currently allows you to create, for free."
 rtg_create_duchies_decision_tooltip:0 "Create all available duchies."
 rtg_create_duchies_decision_effect_tt:0 "You receive, at no cost, every duchy that meets the game's normal creation requirements."
 rtg_create_kingdoms_decision:0 "Create Kingdoms"
 rtg_create_kingdoms_decision_desc:0 "Create every kingdom the game currently allows you to create, for free."
 rtg_create_kingdoms_decision_tooltip:0 "Create all available kingdoms."
 rtg_create_kingdoms_decision_effect_tt:0 "You receive, at no cost, every kingdom that meets the game's normal creation requirements."
 rtg_create_empires_decision:0 "Create Empires"
 rtg_create_empires_decision_desc:0 "Create every empire the game currently allows you to create, for free."
 rtg_create_empires_decision_tooltip:0 "Create all available empires."
 rtg_create_empires_decision_effect_tt:0 "You receive, at no cost, every empire that meets the game's normal creation requirements."
 rtg_distribute_duchies_decision:0 "Distribute Duchies"
 rtg_distribute_duchies_decision_desc:0 "Grant each duchy to the holder of its de jure capital county, as long as their primary title lies within it."
 rtg_distribute_duchies_decision_tooltip:0 "Distribute your duchies by geography."
 rtg_distribute_duchies_decision_effect_tt:0 "Each duchy (except your capital's and excluded ones) goes to the holder of its de jure capital county; as a last resort, to the vassal with the most counties in it. The recipient's primary title must lie within the duchy; if nobody qualifies, you keep it. Its de jure vassals will serve the new holder."
 rtg_distribute_kingdoms_decision:0 "Distribute Kingdoms"
 rtg_distribute_kingdoms_decision_desc:0 "Grant each kingdom to the holder of its de jure capital duchy or, failing that, of its capital county, as long as their primary title lies within it."
 rtg_distribute_kingdoms_decision_tooltip:0 "Distribute your kingdoms by geography."
 rtg_distribute_kingdoms_decision_effect_tt:0 "Each kingdom (except your capital's and excluded ones) goes to the holder of its de jure capital duchy or, failing that, of its capital county; as a last resort, to the vassal with the most counties in it. The recipient's primary title must lie within the kingdom; if nobody qualifies, you keep it. Its de jure vassals will serve the new holder."
 rtg_distribute_empires_decision:0 "Distribute Empires"
 rtg_distribute_empires_decision_desc:0 "Grant each empire to the holder of its de jure capital kingdom or, failing that, of its capital duchy or capital county, as long as their primary title lies within it."
 rtg_distribute_empires_decision_tooltip:0 "Distribute your empires by geography."
 rtg_distribute_empires_decision_effect_tt:0 "Each empire (except your capital's and excluded ones) goes to the holder of its de jure capital kingdom or, failing that, of its capital duchy or capital county; as a last resort, to the vassal with the most counties in it. The recipient's primary title must lie within the empire; if nobody qualifies, you keep it. Its de jure vassals will serve the new holder."
 rtg_title_excluded_tt:0 "This title is now excluded from distribution."
 rtg_title_included_tt:0 "This title will now be included in distribution."
 rtg_exclude_button:0 "Exclude from distribution"
 rtg_include_button:0 "Include in distribution"
 rtg_exclude_button_tt:0 "Excluded titles are never granted by the Title Distribution decisions."
 rtg_transfer_vassals_decision_confirm:0 "Transfer vassals"
 rtg_grant_counties_own_culture_decision_confirm:0 "Grant counties"
 rtg_grant_counties_local_culture_decision_confirm:0 "Grant counties"
 rtg_create_duchies_decision_confirm:0 "Create duchies"
 rtg_create_kingdoms_decision_confirm:0 "Create kingdoms"
 rtg_create_empires_decision_confirm:0 "Create empires"
 rtg_distribute_duchies_decision_confirm:0 "Distribute duchies"
 rtg_distribute_kingdoms_decision_confirm:0 "Distribute kingdoms"
 rtg_distribute_empires_decision_confirm:0 "Distribute empires"
 rtg_preview_county_new_vassal:0 "[TITLE.GetName] goes to a new vassal"
 rtg_preview_title_to_vassal:0 "[TITLE.GetName] goes to [TARGET_CHARACTER.GetShortUIName]"
 rtg_preview_title_no_recipient:0 "[TITLE.GetName] stays with you #weak (no valid vassal)#!"
 rtg_preview_vassal_transfer:0 "[CHARACTER.GetShortUIName] swears fealty to [TARGET_CHARACTER.GetShortUIName]"
 rtg_vassal_limit_warning_tt:0 "@warning_icon! This creates #V [GetPlayer.MakeScope.ScriptValue('rtg_counties_to_grant_value')|0]#! new vassals. Keep an eye on your [vassal_limit|E]: distribute your duchies afterwards to place the new counts under your dukes."
