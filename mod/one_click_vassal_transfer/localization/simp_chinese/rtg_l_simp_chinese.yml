l_simp_chinese:
 decision_group_type_rtg:0 "分封头衔"
 rtg_transfer_vassals_decision:0 "将封臣转移给其法理上的领主"
 rtg_transfer_vassals_decision_desc:0 "各直属封臣都要向其法理上的领主宣誓效忠。"
 rtg_transfer_vassals_decision_tooltip:0 "根据法理头衔重新组织你的封臣。"
 rtg_transfer_vassals_decision_effect_tt:0 "各直属封臣都要向其法理上的领主宣誓效忠（交战中的封臣除外）。"
 rtg_grant_counties_own_culture_decision:0 "授予伯国 （你的文化）"
 rtg_grant_counties_own_culture_decision_desc:0 "除了首都所在地和被排除的伯国之外，你领地内的各伯国都被授予了一个全新的、符合你文化、信仰和礼仪的角色。"
 rtg_grant_counties_own_culture_decision_tooltip:0 "一伯国一新臣。"
 rtg_grant_counties_own_culture_decision_effect_tt:0 "对于每一个既不是首都所在地也不被排除在外的伯国，都会创建一名拥有你的文化、信仰和礼仪的新角色，并将该伯国授予此人。"
 rtg_grant_counties_local_culture_decision:0 "授予伯国 （当地文化）"
 rtg_grant_counties_local_culture_decision_desc:0 "除了首都所地在和被排除的伯国之外，你领地内的各伯国都会被授予一个全新的当地文化、信仰和礼仪的角色。"
 rtg_grant_counties_local_culture_decision_tooltip:0 "一伯国一新臣。"
 rtg_grant_counties_local_culture_decision_effect_tt:0 "对于每一个既不是首都所在地也不被排除在外的伯国，都会创建一名拥有当地文化、信仰和礼仪的新角色，并将该伯国授予此人。"
 rtg_has_counties_to_grant_tt:0 "你至少拥有一个既不是你的首都所在地，也没有被排除在外的伯国"
 rtg_has_titles_to_distribute_tt:0 "你至少拥有一个该等级的头衔，该头衔不是你的主要头衔，不包含你的首都所在地，且未被排除在外"
 rtg_create_duchies_decision:0 "创建公国"
 rtg_create_duchies_decision_desc:0 "免费创建游戏当前允许你创建的所有公国。"
 rtg_create_duchies_decision_tooltip:0 "创建所有可用的公国。"
 rtg_create_duchies_decision_effect_tt:0 "只要满足游戏正常的创建要求，你就可以免费获得各公国。"
 rtg_create_kingdoms_decision:0 "创建王国"
 rtg_create_kingdoms_decision_desc:0 "免费创建游戏当前允许你创建的所有王国。"
 rtg_create_kingdoms_decision_tooltip:0 "创建所有可用的王国。"
 rtg_create_kingdoms_decision_effect_tt:0 "只要满足游戏正常的创建要求，你就可以免费获得各王国。"
 rtg_create_empires_decision:0 "创建帝国"
 rtg_create_empires_decision_desc:0 "免费创建游戏当前允许你创建的所有帝国。"
 rtg_create_empires_decision_tooltip:0 "创建所有可用的帝国。"
 rtg_create_empires_decision_effect_tt:0 "只要满足游戏正常的创建要求，你就可以免费获得各帝国。"
 rtg_distribute_duchies_decision:0 "分封公国"
 rtg_distribute_duchies_decision_desc:0 "只要公爵居住在其法理首都所在地伯国，且其主要头衔位于该伯国，则将各公国授予其法理首都所在地伯国的持有者。"
 rtg_distribute_duchies_decision_tooltip:0 "按地理位置分封你的领地。"
 rtg_distribute_duchies_decision_effect_tt:0 "各公国（除了首都和被排除在外的公国）将归属其法理首都伯国的持有者；若无法确定归属，则归属其中拥有最多伯国的持有者。接收者必须居住在该公国内，且其主要头衔必须位于该公国内；若无人符合条件，则由你保留。其法理封臣将效忠于新的持有者。"
 rtg_distribute_kingdoms_decision:0 "分封王国"
 rtg_distribute_kingdoms_decision_desc:0 "只要各王国领土的法理首都所在地公国（或若无法确定法理首都，则为其首都所在地伯国）的持有者居住在该地且其主要头衔位于该地，则将各王国授予该持有者。"
 rtg_distribute_kingdoms_decision_tooltip:0 "根据地理位置分封你的王国。"
 rtg_distribute_kingdoms_decision_effect_tt:0 "各王国（除了首都所在地的王国和被排除在外的王国）将归属于其法理首都所在地公国的持有者，若无法确定，则归属于其首都所在地伯国的持有者；若仍无法确定，则归属于该王国中拥有最多伯国的持有者。接收者必须居住在该王国，且其主要头衔必须位于该王国之内；若无人符合条件，则由你保留。其法理封臣将效忠于新的持有者。"
 rtg_distribute_empires_decision:0 "分封帝国"
 rtg_distribute_empires_decision_desc:0 "只要其居住地位于其法理首都王国（若无法确定，则为其首都所在地公国或伯国）内，且其主要头衔位于该地，则将各帝国授予其法理首都王国（若无法确定，则为其首都公国或首都伯国）的持有者。"
 rtg_distribute_empires_decision_tooltip:0 "根据地理位置分封你的帝国。"
 rtg_distribute_empires_decision_effect_tt:0 "各帝国（除了首都所在地的帝国和被排除在外的帝国）会归属于其法理首都所在地王国的持有者，若无法确定，则归属于其首都公国或首都伯国的持有者；若仍无法确定，则归属于该帝国中伯国数量最多的持有者。接收者必须居住在该帝国境内，且其主要头衔必须位于该帝国之内；若无人符合条件，则由你保留。其法理封臣将效忠于新的持有者。"
 rtg_title_excluded_tt:0 "此头衔现已排除在分封范围之外。"
 rtg_title_included_tt:0 "此头衔现在将被纳入分封范围内。"
 rtg_exclude_button:0 "排除在分封范围外"
 rtg_include_button:0 "纳入到分封范围内"
 rtg_exclude_button_tt:0 "被排除的头衔永远不会通过“头衔分封”决议获得。"
 rtg_transfer_vassals_decision_confirm:0 "转封封臣"
 rtg_grant_counties_own_culture_decision_confirm:0 "授予伯国"
 rtg_grant_counties_local_culture_decision_confirm:0 "授予伯国"
 rtg_create_duchies_decision_confirm:0 "创建公国"
 rtg_create_kingdoms_decision_confirm:0 "创建王国"
 rtg_create_empires_decision_confirm:0 "创建帝国"
 rtg_distribute_duchies_decision_confirm:0 "分封公国"
 rtg_distribute_kingdoms_decision_confirm:0 "分封王国"
 rtg_distribute_empires_decision_confirm:0 "分封帝国"
 rtg_preview_county_new_vassal:0 "[TITLE.GetName]将授予一名新封臣"
 rtg_preview_title_to_vassal:0 "[TITLE.GetName]将授予[TARGET_CHARACTER.GetShortUIName]"
 rtg_preview_title_no_recipient:0 "[TITLE.GetName]仍在你麾下 #weak (非有效封臣)#!"
 rtg_preview_vassal_transfer:0 "[CHARACTER.GetShortUIName]向[TARGET_CHARACTER.GetShortUIName]宣誓效忠"
 rtg_vassal_limit_warning_tt:0 "@warning_icon!这将创建#V [GetPlayer.MakeScope.ScriptValue('rtg_counties_to_grant_value')|0]#!个新封臣。请注意你的[vassal_limit|E]:之后再分封你的公国，将新伯国置于你的公国之下。"
 rtg_fix_bordergore_decision:0 "修复边界混乱"
 rtg_fix_bordergore_decision_desc:0 "收回你的封臣在其法理领地之外所占据的伯国，并让那些效忠于错误领主的封臣直接向你宣誓效忠。"
 rtg_fix_bordergore_decision_tooltip:0 "清除你封臣的边界"
 rtg_fix_bordergore_decision_effect_tt:0 "只要你的公爵及以上级别领主在其领地内至少保留一个伯国，他们所拥有的、法理上不属于他们的伯国就会回归于你。而他们的封臣，如果其主要头衔不在这些法理的头衔之内，则将成为你的直接封臣。"
 rtg_fix_bordergore_decision_confirm:0 "修复边界混乱"
 rtg_preview_bg_county:0 "[TITLE.GetName]从[TARGET_CHARACTER.GetShortUIName]手中回归于你"
 rtg_preview_bg_subvassal:0 "[CHARACTER.GetShortUIName]脱离[TARGET_CHARACTER.GetShortUIName]并向你效忠"
